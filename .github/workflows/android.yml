---
name: Android build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: 33
  ANDROID_NDK_VERSION: 26.1.10909125

jobs:
  build-core:
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi:
          - armhf

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          repository: tpolydoro/OpenCPN
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Check native build tools
        run: |
          cmake --version

      - name: Prepare RapidJSON
        run: |
          mkdir -p .ci/rapidjson
          curl --fail --location --retry 3 \
            --output .ci/rapidjson.tar.gz \
            https://github.com/Tencent/rapidjson/archive/refs/tags/v1.1.0.tar.gz
          echo "badd12c511e081fec6c89c43a7027bce  .ci/rapidjson.tar.gz" | md5sum --check
          tar --extract --gzip --strip-components=1 \
            --file .ci/rapidjson.tar.gz \
            --directory .ci/rapidjson

      - name: Configure CMake
        env:
          ABI: ${{ matrix.abi }}
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME}"
          export ANDROID_NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          export TOOL_BASE="${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64"

          if [ "${ABI}" = "arm64" ]; then
            ln -sf llvm-ar "${TOOL_BASE}/bin/aarch64-linux-android-ar"
          fi

          cmake -S . -B "build-android-${ABI}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DOCPN_TARGET_TUPLE:STRING="Android-${ABI};${ANDROID_API};${ABI}" \
            -DOCPN_BUILD_SAMPLE=ON \
            -DSKIP_PLUGINS=ON \
            -DRAPIDJSON:PATH="${GITHUB_WORKSPACE}/.ci/rapidjson/include/rapidjson" \
            -Dtool_base="${TOOL_BASE}"

      - name: Build native library
        env:
          ABI: ${{ matrix.abi }}
        run: |
          cmake --build "build-android-${ABI}" --target lunasvg --parallel 2
          cmake --build "build-android-${ABI}" --parallel 2 --verbose

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: opencpn-android-${{ matrix.abi }}
          if-no-files-found: error
          path: build-android-${{ matrix.abi }}/libgorp.so

      - name: Install Qt Android build support
        if: matrix.abi == 'armhf'
        run: |
          test -x cache/OCPNAndroidCoreBuildSupport/qt5/build_arm32_19_O3/qtbase/bin/qmake
          test -x cache/OCPNAndroidCoreBuildSupport/qt5/build_arm32_19_O3/qtbase/bin/androiddeployqt

      - name: Build APK
        if: matrix.abi == 'armhf'
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME}"
          export ANDROID_NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          export QT_ANDROID_ROOT="$GITHUB_WORKSPACE/cache/OCPNAndroidCoreBuildSupport/qt5/build_arm32_19_O3/qtbase"
          export WX_INCLUDE="$(find "$GITHUB_WORKSPACE/cache/OCPNAndroidCoreBuildSupport/wxWidgets/libs/armhf/lib/wx/include" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$WX_INCLUDE"

          mkdir -p "$QT_ANDROID_ROOT/mkspecs/android-clang"
          touch "$QT_ANDROID_ROOT/mkspecs/features/spec_pre.prf"
          touch "$QT_ANDROID_ROOT/mkspecs/features/spec_post.prf"
          touch "$QT_ANDROID_ROOT/mkspecs/features/default_pre.prf"
          touch "$QT_ANDROID_ROOT/mkspecs/features/default_post.prf"
          cat > "$QT_ANDROID_ROOT/mkspecs/android-clang/qmake.conf" <<'EOF'
          MAKEFILE_GENERATOR      = UNIX
          QMAKE_PLATFORM          = android
          QMAKE_COMPILER          = clang
          QMAKE_DIR_SEP           = /
          QMAKE_CC                = $$(ANDROID_NDK_ROOT)/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang
          QMAKE_CXX               = $$(ANDROID_NDK_ROOT)/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang++
          QMAKE_LINK              = $$QMAKE_CXX
          QMAKE_AR                = $$(ANDROID_NDK_ROOT)/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          QMAKE_STRIP             = $$(ANDROID_NDK_ROOT)/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip
          QMAKE_CFLAGS            = --sysroot=$$(ANDROID_NDK_ROOT)/toolchains/llvm/prebuilt/linux-x86_64/sysroot
          QMAKE_CXXFLAGS          = $$QMAKE_CFLAGS -std=gnu++17
          QMAKE_LFLAGS            = $$QMAKE_CFLAGS
          QMAKE_LIBS              = -llog -landroid -lEGL -lGLESv2 -lz
          QMAKE_INCDIR_QT         = $$(QT_ANDROID_ROOT)/include
          QMAKE_LIBDIR_QT         = $$(QT_ANDROID_ROOT)/lib
          QMAKE_XSPEC             = android-clang
          EOF

          mkdir -p apk-build
          cd apk-build
          "$QT_ANDROID_ROOT/bin/qmake" \
            QMAKE_QMAKE="$QT_ANDROID_ROOT/bin/qmake" \
            OCPN_ROOT="$GITHUB_WORKSPACE" \
            WX_INCLUDE="$WX_INCLUDE" \
            ../buildandroid/opencpn-apk.pro \
            -o Makefile.android
          make -f Makefile.android --jobs=2
          make -f Makefile.android install INSTALL_ROOT="$PWD/install"

          sed -i \
            -e 's/android:targetSdkVersion="[0-9]*"/android:targetSdkVersion="33"/' \
            -e 's/android:versionCode="[0-9]*"/android:versionCode="1"/' \
            ../buildandroid/android/AndroidManifest.xml

          DEPLOYMENT_JSON="$(find . .. -type f -name '*deployment-settings.json' -print -quit)"
          test -n "$DEPLOYMENT_JSON"
          sed -i \
            -e "s|/home/dsr/Projects/qt5/build_arm64_O3/qtbase|$QT_ANDROID_ROOT|g" \
            -e "s|/home/dsr/Projects/qt5/build_arm32_19_O3/qtbase|$QT_ANDROID_ROOT|g" \
            "$DEPLOYMENT_JSON"
          test -d "$ANDROID_SDK_ROOT/platforms/android-${ANDROID_API}"
          "$QT_ANDROID_ROOT/bin/androiddeployqt" \
            --input "$DEPLOYMENT_JSON" \
            --output "$PWD/apk" \
            --android-platform android-33 \
            --deployment bundled

      - name: Upload APK
        if: matrix.abi == 'armhf'
        uses: actions/upload-artifact@v4
        with:
          name: opencpn-android-apk
          if-no-files-found: error
          path: apk-build/apk/**/*.apk
